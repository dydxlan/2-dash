<html>
  <head>
    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@latest?dev",
          "react-dom/client": "https://esm.sh/react-dom@latest/client?dev",
          "react/jsx-runtime": "https://esm.sh/react@latest/jsx-runtime?dev"
        }
      }
    </script>
    <!-- Babel Standalone -->
    <script src="https://unpkg.com/@babel/standalone@latest/babel.min.js"></script>
  </head>

  <body>
    <div id="text 1"></div> /*placing the root node? */
    <script type="text/babel" data-type="module" data-presets="react">
        import React from 'react';
        import { createRoot } from 'react-dom/client';

        const domNode = document.getElementById('text 1'); /*getting the DOM node? */

        function Header() { /*header function */
        return <h1>Header</h1>; 
        }

        function Footer() { /*footer function */
            return <h1>Footer</h1>;
        }
        
        function Sidebar({Sidebar1, Sidebar2}) { /*sidebar function */
            /*return <h1>Sidebar</h1>;*/          
            return (
                <div>
                    <Sidebar1 />
                    <Sidebar2 />
                </div>
            );
        }

        function Sidebar1() { /*sidebar function */
            return <h1>Sidebar1</h1>;
        }

        function Sidebar2() { /*sidebar function */
            return <h1>Sidebar2</h1>;
        }

        function HomePage() { /*homepage function */
            return (
                <div>
                    <Header /> /*calling header function */
                    <Sidebar><Sidebar1 /><Sidebar2 /></Sidebar> /*calling sidebar function */
                    <Footer /> /*calling footer function */
                </div>
            );
        }
        const root = createRoot(domNode);
        root.render(<HomePage />);
    </script>
  </body>
</html>
